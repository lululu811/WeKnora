      embedding_top_k: 10
      keyword_threshold: 0.3
      vector_threshold: 0.5
      rerank_top_k: 10
      rerank_threshold: 0.3

  - id: "builtin-skill-installer"
    avatar: "📦"
    is_builtin: true
    i18n:
      default:
        name: "Skill Installer"
        description: "Internal agent that installs an uploaded skill and its dependencies into the sandbox image"
      zh-CN:
        name: "技能安装器"
        description: "把上传的技能及其依赖装进沙箱镜像的内部智能体"
      zh-TW:
        name: "技能安裝器"
        description: "把上傳的技能及其相依套件裝進沙箱鏡像的內部智能體"
      ja-JP:
        name: "スキルインストーラー"
        description: "アップロードされたスキルとその依存関係をサンドボックスイメージにインストールする内部エージェント"
      ko-KR:
        name: "스킬 설치 도구"
        description: "업로드된 스킬과 의존성을 샌드박스 이미지에 설치하는 내부 에이전트"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "skill_installer"
      temperature: 0.2
      max_completion_tokens: 24576
      max_iterations: 30
      kb_selection_mode: "none"
      retrieve_kb_only_when_mentioned: false
      # The install path unions these three in regardless of what is written
      # here: an install that cannot write its own skill directory cannot
      # record what it did. They are listed for accuracy, not as the source of
      # truth. write_skill_file / edit_skill_file reach only the one skill
      # being installed and are never offered to a tenant-editable agent.
      allowed_tools:
        - "shell_exec"
        - "write_skill_file"
        - "edit_skill_file"
      web_search_enabled: false
      web_search_max_results: 0
      reflection_enabled: false
      multi_turn_enabled: true


  # ===========================================================================
  # Finance Research Agents
  # ===========================================================================

  - id: "builtin-zettaranc"
    avatar: "📈"
    is_builtin: true
    i18n:
      default:
        name: "Z哥"
        description: "前阳光私募冠军基金经理的交易思维框架，60+ 指标，30+ 战法"
      zh-CN:
        name: "Z哥"
        description: "前阳光私募冠军基金经理的交易思维框架，60+ 技术指标，30+ 战法识别，策略回测"
      zh-TW:
        name: "Z哥"
        description: "前陽光私募冠軍基金經理的交易思維框架，60+ 技術指標，30+ 戰法識別，策略回測"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "zettaranc"
      # 声明工作台，否则 K 线面板不会渲染。
      #
      # 工作台由 `session → agent → config.workbench` 推导，前端据此决定侧栏能挂哪些
      # 组件（见 frontend/src/composables/useWorkbench.ts）。`finance` 词表在
      # internal/types/workbench.go 里定义、components 为 ["kline"]，但此前**没有任何
      # agent 引用它** —— 于是 K 线整条链路（数据、指标、形态、标注）全都是死代码：
      # 组件不报错，只是永远不出现。改/删这个字段前先确认 Z 哥是唯一该挂 K 线的 agent。
      workbench: "finance"
      temperature: 0.3
      max_completion_tokens: 0
      max_iterations: 100
      kb_selection_mode: "selected"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        # Discovery tool
        - "hithink.finance.discover"

        # Public tools (hithink finance data)
        - "hithink.finance.market.price.snapshot"
        - "hithink.finance.market.price.historical"
        - "hithink.finance.financial.valuation.snapshot"
        - "hithink.finance.financial.statement.income"
        - "hithink.finance.financial.statement.balance"
        - "hithink.finance.financial.statement.cashflow"
        - "hithink.finance.financial.indicator.detail"
        - "hithink.finance.index.sector.membership"
        - "hithink.finance.index.sector.constituents"
        - "hithink.finance.index.sector.daily"
        - "hithink.finance.indicator.trend.ma"
        - "hithink.finance.indicator.momentum.kdj"
        - "hithink.finance.special.limit.limit_up_pool"
        - "hithink.finance.special.dragon_tiger.list"
        - "hithink.finance.special.hot_stock.skyrocket"

        # 形态识别与技术分析。这五个在 agent_service.go 早已注册，但此前漏在
        # 白名单之外 —— 注册了不等于 agent 能用：白名单决定注册遍历范围，
        # 不在名单里的工具既不会进模型的 tool schema，调用时也只会得到
        # "tool not found"。缺它们意味着趋势、量价背离、图表形态、支撑阻力
        # 这四类分析 Z哥 一直在用别的方式绕。
        - "hithink.finance.pattern.scan"
        - "hithink.finance.analysis.trend"
        - "hithink.finance.analysis.volume"
        - "hithink.finance.analysis.pattern"
        - "hithink.finance.analysis.levels"

        - "hithink.finance.query.sql"

        # Zettaranc exclusive tools (Python CLI)
        #
        # zettaranc.backtest **故意不在这里**。它是一个会明确失败的桩工具
        # （backtest.go 的 Execute 直接返回 Success:false，描述首行就写着
        # 「未实现，调用会直接失败」）。把它列进白名单 = 让模型看得见、点得着，
        # 而且 100% 失败：白白烧掉一轮 ReAct 迭代，还往 tool-call 记录里掺一条
        # 无用的调用。一个必定失败的工具比没有这个工具更糟。
        #
        # 实现文件仍留在仓库里（backtest.go + agent_service.go 的构造分支），
        # 真实回测落地后加回这一行即可，无需重写工具本身。
        - "zettaranc.analyze"
        - "zettaranc.screener"
        - "zettaranc.four_bricks"

      web_search_enabled: true
      web_search_max_results: 10
      reflection_enabled: false
      multi_turn_enabled: true

  - id: "builtin-halo"
    avatar: ""
    is_builtin: true
    i18n:
      default:
        name: "HALO"
        description: "A 股基本面可信分析，11 维框架，数据层由 Python 锁定"
      zh-CN:
        name: "HALO"
        description: "A 股基本面可信分析，11 维框架，数据层由 Python 锁定"
      zh-TW:
        name: "HALO"
        description: "A 股基本面可信分析，11 維框架，數據層由 Python 鎖定"
    config:
      agent_mode: "smart-reasoning"
      agent_type: "custom"
      system_prompt_id: "halo"
      temperature: 0.3
      max_completion_tokens: 0
      # 数据层是确定性计算（下载+解析单份年报约 1-3 分钟），给足迭代预算，
      # 否则 sync 还没回来就停了，会被当成超时。
      max_iterations: 60
      kb_selection_mode: "selected"
      retrieve_kb_only_when_mentioned: false
      allowed_tools:
        # HALO 链路：同步年报 → 取评分与锚点 → 复算校验
        - "halo.filing.sync"
        - "halo.filing.query"
        - "halo.analyze"
        - "halo.verify"

        # 行情与估值：判断「现在贵不贵」「价格处在什么位置」需要
        - "hithink.finance.market.price.snapshot"
        - "hithink.finance.market.price.historical"
        - "hithink.finance.financial.valuation.snapshot"
        - "hithink.finance.financial.statement.income"
        - "hittink.finance.financial.statement.balance"
        - "hithink.finance.financial.statement.cashflow"
        - "hithink.finance.financial.indicator.detail"
        - "hithink.finance.index.sector.constituents"
        - "hithink.finance.index.sector.daily"
        - "hithink.finance.analysis.trend"
        - "hithink.finance.analysis.levels"
        - "hithink.finance.query.sql"

      web_search_enabled: true
      web_search_max_results: 8
      reflection_enabled: false
      multi_turn_enabled: true
