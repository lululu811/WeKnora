# config/indicators.yaml — 指标元数据唯一真源 (single source of truth)
#
# 这里只放**元数据**：名字、参数、默认周期、公式版本、显示精度、画在主图还是副图。
# 公式实现**不**在这里，也**不**在这里统一：Go / Python / TypeScript 各自保留自己的
# 实现。统一的是"同一个指标叫什么、用什么参数、按几位小数显示"——参数漂移才是
# 真正会让人看错盘的东西，公式实现重复是可以接受的。
#
# 读取方（三端都读这一个文件）：
#   Go       internal/indicators.Load()            — internal/indicators/meta.go
#   前端     frontend/src/components/workspace/kline/indicator-meta.ts（由本文件生成）
#   Python   python-service/zettaranc/indicator_meta.py（懒加载，只读元数据）
#
# 改完本文件后必须重新生成前端模块：
#   go test ./internal/indicators/ -run TestGeneratedFrontendModule -update
# 该测试在忘记重新生成时会**大声失败**（这是刻意的，见 internal/indicators/meta_test.go）。
#
# 字段说明见同目录 docs: config/indicators.schema.md
schema_version: 1

# 跨栈一致性判定的公共设置，被 internal/indicators/conformance_test.go 使用。
conformance:
  # |go - js| <= abs_tolerance 视为一致。选 0.01 的原因：三端都把结果
  # round 到 2 位小数（前端 toFixed(2)、Go math.Round），0.01 正好是
  # "同一个数被两种舍入方式写出来" 的最大可能差。再小就是在测浮点噪声。
  abs_tolerance: 0.01
  # 合成 K 线的根数。必须 > 114，否则 Z_MAIN 的黄线（MA114）全程为 null。
  fixture_bars: 260

indicators:
  # ---------------------------------------------------------------- 主图 ----
  - id: Z_MAIN
    short_name: 战法主图
    # composite: 一条指标同时画多条**互相独立**的线（不是一条线的多段）。
    # Z_SIGNALS/MA/BOLL 这类"一个副图里的多条线"用的是 subchart，不是 composite。
    kind: composite
    panel: main
    formula_version: v1
    precision: 2
    default_enabled: true
    summary: 战法核心主图：白线(DEMA10) + 黄线(多空线 14/28/57/114) + BBI 牵牛绳
    # calc_params 是 klinecharts 设置面板里显示/可改的那几个格子，缺省等于
    # params 的值。Z_MAIN 是唯一需要覆盖的：它的 calcParams 历来是 [10, 14]，
    # 而真正的 3 条线各自带自己的 series.params。14 是历史残留（calc 不读它），
    # 改掉会动到用户已保存的图表配置，所以原样保留并在这里说明。
    calc_params: [10, 14]
    params:
      - { name: white_period, value: 10 }
    series:
      - key: zg_white
        label: 白线
        formula: DEMA
        precision: 2
        color: white
        line_width: 1.8
        params: [10]
      - key: dg_yellow
        label: 黄线
        formula: LONGBBI
        precision: 2
        color: yellow
        line_width: 1.8
        params: [14, 28, 57, 114]
      - key: bbi
        label: BBI
        formula: BBI
        precision: 2
        color: orange
        line_width: 1.8
        params: [3, 6, 12, 24]
    storage:
      backend: frontend
      duckdb_view: ""
      # Go / Python 栈的 v_indicators_daily 里**没有** DEMA / 多空线 / BBI 列，
      # 这三条线只在浏览器里算。conformance_test.go 会断言这里为空是真的为空。
      columns: []

  - id: Z_SIGNALS
    short_name: 信号层
    # overlay: 纯画布装饰层，没有 series 也不产生数值，只在 draw() 里画
    # 神奇九转 / 形态气泡 / 极值引导线。
    kind: overlay
    panel: main
    formula_version: v1
    precision: 0
    default_enabled: false
    summary: 同花顺风格主图装饰：神奇九转 1..9 + K 线形态气泡 + 极值价格引导线
    params: []
    series: []
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: ZG_WHITE
    short_name: 白线
    kind: line
    panel: main
    formula_version: v1
    precision: 2
    default_enabled: false
    summary: 白线 = 二次平滑指数均线 DEMA(EMA(CLOSE,10),10)
    params:
      - { name: period, value: 10 }
    series:
      - key: zg_white
        label: 白线(10)
        formula: DEMA
        precision: 2
        color: white
        line_width: 1.8
        params: [10]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: DG_YELLOW
    short_name: 黄线
    kind: line
    panel: main
    formula_version: v1
    precision: 2
    default_enabled: false
    summary: 黄线（知行多空线/大哥线）= (MA14+MA28+MA57+MA114)/4
    params:
      - { name: period_1, value: 14 }
      - { name: period_2, value: 28 }
      - { name: period_3, value: 57 }
      - { name: period_4, value: 114 }
    series:
      - key: dg_yellow
        label: 黄线(14/28/57/114)
        formula: LONGBBI
        precision: 2
        color: yellow
        line_width: 1.8
        params: [14, 28, 57, 114]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: Z_BBI
    short_name: BBI
    kind: line
    panel: main
    formula_version: v1
    precision: 2
    default_enabled: false
    summary: 牵牛绳多空平衡线 = (MA3+MA6+MA12+MA24)/4
    params:
      - { name: period_1, value: 3 }
      - { name: period_2, value: 6 }
      - { name: period_3, value: 12 }
      - { name: period_4, value: 24 }
    series:
      - key: bbi
        label: BBI
        formula: BBI
        precision: 2
        color: orange
        line_width: 1.8
        params: [3, 6, 12, 24]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  # ---------------------------------------------------------------- 副图 ----
  - id: Z_VOL
    short_name: 成交量
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 0
    default_enabled: true
    summary: 经典同花顺成交量：红绿量柱 + MA5/MA10 均量线
    params:
      - { name: ma_short, value: 5 }
      - { name: ma_long, value: 10 }
    series:
      - key: vol
        label: 总量
        formula: VOLUME
        type: bar
        base_value: 0
        precision: 0
        color: volume_bar
        params: []
      - key: ma5
        label: MA5
        formula: SMA
        type: line
        precision: 0
        color: auxAmber
        line_width: 1.2
        params: [5]
      - key: ma10
        label: MA10
        formula: SMA
        type: line
        precision: 0
        color: auxSky
        line_width: 1.2
        params: [10]
    storage:
      # 2026-10-01 从 duckdb 改为 frontend，与 Z_MACD / Z_KDJ 同理。
      # 此前声明走 v_daily_qfq 的 volume，但工作台的 calcVOL 从 /api/kline
      # 返回的 OHLCV 里取量（那条链路本来就传 volume），没有单独查过这一列。
      # 顺带说明：这一项只有 volume 一个别名，而它有 3 条 series（vol/ma5/ma10）——
      # ma5/ma10 是前端算的，此前声明里根本没有它们的列，即便走 duckdb 也对不上。
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: Z_MACD
    short_name: MACD
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 2
    default_enabled: false
    summary: 同花顺风 MACD：DIFF + DEA + 柱状图 + 金叉/死叉徽章
    params:
      - { name: short, value: 12 }
      - { name: long, value: 26 }
      - { name: signal, value: 9 }
    series:
      - key: dif
        label: DIFF
        formula: MACD_DIF
        type: line
        precision: 2
        color: auxAmber
        line_width: 1.3
        params: [12, 26]
      - key: dea
        label: DEA
        formula: MACD_DEA
        type: line
        precision: 2
        color: auxSky
        line_width: 1.3
        params: [12, 26, 9]
      - key: macd
        label: MACD
        formula: MACD_HIST
        type: bar
        base_value: 0
        precision: 2
        color: macd_hist
        params: [12, 26, 9]
    storage:
      # 2026-10-01 从 duckdb 改为 frontend。此前声明走 v_indicators_daily 的
      # momentum_macd_12_26_9_* 三列，但工作台从未读过它们 —— indicators.ts 的
      # calcMACD 从同一份 OHLCV 在浏览器里算了一遍，`/api/indicators` 端点至今
      # 零调用方。声明"走列"而实际本地算，是一处会骗人的失真：改公式时去改列的
      # 生产者（a-stock 侧）不会影响工作台显示。
      #
      # 选 frontend 而不是改前端读列的理由:
      #  - DuckDB 那份由 conformance 的 Go reference 间接保证（refMACD 与前端
      #    逐 bar 对照，容差 0.01），两边不会各自漂;
      #  - 改前端读列要给 /api/kline 加协议（一次返回 1035 万行指标列的前缀
      #    膨胀），引入新的网络失败模式，换来的是"概念上更纯"。
      backend: frontend
      duckdb_view: ""
      # 前端口径：hist = (dif - dea) * 2。DuckDB 的
      # momentum_macd_12_26_9_hist 同样是**已经乘过 2** 的 —— 这个「×2」是历史
      # 约定，两边一致，不要单方面改。
      columns: []

  - id: Z_KDJ
    short_name: KDJ
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 2
    default_enabled: false
    summary: 同花顺风 KDJ：K/D/J 三线 + 金叉/死叉徽章
    params:
      - { name: n, value: 9 }
      - { name: k_smooth, value: 3 }
      - { name: d_smooth, value: 3 }
    series:
      - key: k
        label: K
        formula: KDJ_K
        type: line
        precision: 2
        color: auxOrange
        line_width: 1.3
        params: [9, 3]
      - key: d
        label: D
        formula: KDJ_D
        type: line
        precision: 2
        color: auxSky
        line_width: 1.3
        params: [9, 3, 3]
      - key: j
        label: J
        formula: KDJ_J
        type: line
        precision: 2
        color: kdjJ
        line_width: 1.3
        params: [9, 3, 3]
    storage:
      # 2026-10-01 从 duckdb 改为 frontend，与 Z_MACD / Z_VOL 同理。
      # 此前声明走 v_indicators_daily 的 momentum_kdj_9_3_k/d/j，但工作台的
      # calcKDJ 从 OHLCV 在浏览器里算 —— /api/indicators 零调用方。
      #
      # 这一项此前还带着一处更旧的注释说「Go 的 data.go 没有读 kdj 三列」，
      # 那条早已修掉（由 analysis/kdj_contract_test.go 拿真实 DuckDB fixture
      # 守住非零）。Go 侧现在确实读这三列，但那是 **agent 的 analysis 工具**在读，
      # 与工作台无关：工作台是浏览器直连 python-service，两条链路互不相干。
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: ZX_BRICK
    short_name: ZX砖型图
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 2
    default_enabled: true
    summary: 同花顺知行砖型图：连续同向 K 线合并成阶梯砖块，块数代表趋势强度
    params:
      - { name: lookback, value: 4 }
    series:
      - key: brick
        label: 砖型图
        formula: ZX_BRICK
        type: line
        precision: 2
        color: brick
        line_width: 1.8
        params: [4]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: Z_BRICK
    short_name: ZX砖型图
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 2
    default_enabled: false
    # Z_BRICK 是 ZX_BRICK 的**别名**：注册两次是为了兼容旧的用户配置里存下来的
    # indicator id。两者必须永远保持参数一致——conformance_test.go 会断言这一点。
    alias_of: ZX_BRICK
    summary: 砖型图（ZX_BRICK 的旧 id 别名，保留兼容用户已保存的图表配置）
    params:
      - { name: lookback, value: 4 }
    series:
      - key: brick
        label: 砖型图
        formula: ZX_BRICK
        type: line
        precision: 2
        color: brick
        line_width: 1.8
        params: [4]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

  - id: Z_PCT_RET
    short_name: 涨跌幅
    kind: subchart
    panel: sub
    formula_version: v1
    precision: 2
    default_enabled: false
    # 此前这个 id 叫 Z_RSL，summary 写"相对强度线"，但画的是**百分比涨跌幅**
    # (indicators.ts calcRSL: ((curr-prev)/prev)*100)。而 DuckDB 的
    # zettaranc_rsl_rank_15 / _rank_105 才是真正的相对强弱——滚动窗口**百分位
    # 排名**，值域 [0,100]。同名不同义，且没有任何测试发现：YAML 声明
    # backend: frontend / columns: []，跨栈比对压根不覆盖它。
    #
    # 两个指标各有存在理由（排名是 RSL 的原义，涨跌幅是你每天看的直线），所以
    # 不强行统一，而是**改名让它们各归各位**。2026-10-01 库侧已把 RSL 两列
    # 改名为 *_rank_15 / *_rank_105 以示区别。
    summary: 区间涨跌幅（百分比）：3 日与 21 日两个周期。与 DuckDB 的 RSL 百分位排名不同义
    params:
      - { name: short, value: 3 }
      - { name: long, value: 21 }
    series:
      - key: pct_ret_short
        label: 3日涨跌幅(%)
        formula: PCT_RET
        type: line
        precision: 2
        color: sky
        line_width: 1.5
        params: [3]
      - key: pct_ret_long
        label: 21日涨跌幅(%)
        formula: PCT_RET
        type: line
        precision: 2
        color: purple
        line_width: 1.5
        params: [21]
    storage:
      backend: frontend
      duckdb_view: ""
      columns: []

# ---------------------------------------------------------------------------
# 主图 / 副图模式。KLineWorkspace.vue 的模式按钮列表从这里读，
# 代码里不再出现任何指标名字符串。
#
# `indicators` 允许引用 klinecharts **内置**指标（MA / BOLL / EMA / VOL 等），
# 内置指标不在上面的 `indicators:` 里声明——它们的参数由 klinecharts 自己定义。
# ---------------------------------------------------------------------------
views:
  main_presets:
    - id: zettaranc
      label: 双线+BBI
      hint: 战法核心主图：快线 DEMA10 + 大哥线 LongBBI(14/28/57/114) + BBI牵牛绳(3/6/12/24)。双线判断多空节奏，牵牛绳是多空分界
      indicators: [Z_MAIN]
    - id: all
      label: 战法+MA
      hint: 战法核心线 + 传统 MA5/10/20。给短期均线做参考，适合看价格与短期成本的相对位置
      indicators: [MA, Z_MAIN]
    - id: ma
      label: 传统MA
      hint: 纯传统均线 MA5/10/20/60/120/250，不叠加战法线。最基础的看图方式
      indicators: [MA, Z_SIGNALS]
    - id: boll
      label: BOLL
      hint: 布林带 BOLL(20,2) + 战法信号层。价格触上轨偏强、触下轨偏弱，带宽收窄常预示变盘
      indicators: [BOLL, Z_SIGNALS]
  sub_presets:
    - id: VOL_AND_BRICK
      label: 量+ZX砖型 (推荐)
      hint: 成交量 + 同花顺知行砖型图。砖型把连续同向的 K 线合并成一块，块数代表趋势强度：4 块以上为强势。推荐作为默认副图。
      indicators: [Z_VOL, ZX_BRICK]
    - id: ZX_BRICK
      label: ZX砖型图
      hint: 仅砖型图，不带成交量。适合专注看多空节奏；减号标记回调、止字标记止跌。
      indicators: [ZX_BRICK]
    - id: VOL_AND_MACD
      label: 量+MACD
      hint: 成交量 + MACD。DIF/DEA 金叉死叉会打标记，红柱绿柱表示动能强弱，适合判断趋势转折。
      indicators: [Z_VOL, Z_MACD]
    - id: Z_VOL
      label: 成交量
      hint: 成交量柱 + MA5/MA10 均量线。放量上涨代表资金进场，缩量回调代表抛压不重。
      indicators: [Z_VOL]
    - id: Z_MACD
      label: MACD
      hint: MACD (12,26,9)。DIF 上穿 DEA 为金叉、下穿为死叉，柱状体表示动能变化速度。
      indicators: [Z_MACD]
    - id: Z_KDJ
      label: KDJ
      hint: KDJ 随机指标 (9,3,3)。K/D 在 20 以下为超卖区、80 以上为超买区，金叉死叉会打标记。
      indicators: [Z_KDJ]
    - id: Z_PCT_RET
      label: 涨跌幅
      hint: 区间涨跌幅（百分比），3 日与 21 日两个周期。向上表示这只票在涨，适合快速比对强弱。与 RSL 百分位排名不同指标。
      indicators: [Z_PCT_RET]

# ---------------------------------------------------------------------------
