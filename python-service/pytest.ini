[pytest]
# 三个测试目录都要收进来：只写 tests 时，finance_panel/tests 与
# etfholdings/tests 里的 91 个测试函数从未被收集，CI 一直是空跑它们。
testpaths = tests finance_panel/tests etfholdings/tests
python_files = test_*.py
xfail_strict = true
addopts = -ra
markers =
    defect: asserts the behaviour the service SHOULD have; xfail(strict) until fixed
