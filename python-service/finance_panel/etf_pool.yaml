# ETF 大资金追踪池
#
# 选池依据：汇金历史重仓宽基。汇金（证金/中央汇金）在 2023-2024 多次增持宽基 ETF，
# 这几只的份额变动本身就是"国家队资金流"最直接的观测口 —— 比二级市场成交更能
# 说明真实增量资金的方向。
#
# 代码一律用 6 位裸代码（不带交易所后缀）。后缀在 SQL/DuckDB 侧用 v_symbol /
# v_etf_universe 的 ticker 映射解析，不在这里硬编码 —— 交易所归属会随基金
# 转型/更名变化，写死会在某次基金变更后静默查空。
#
# name 字段只是**给人看的注释**，运行时不依赖它（名称以库内 v_etf_universe 为准），
# 保留是为了让这份清单脱离代码也能读懂。

pool:
  # ---- 沪深 300 系 ----
  - code: "510300"
    name: "沪深300ETF华泰柏瑞"
    tags: ["汇金重仓", "宽基"]
  - code: "510310"
    name: "沪深300ETF易方达"
    tags: ["汇金重仓", "宽基"]
  - code: "159919"
    name: "沪深300ETF嘉实"
    tags: ["汇金重仓", "宽基"]

  # ---- 上证 50 ----
  - code: "510050"
    name: "上证50ETF华夏"
    tags: ["汇金重仓", "宽基"]

  # ---- 中证 500 / 1000 ----
  - code: "510500"
    name: "中证500ETF南方"
    tags: ["汇金重仓", "宽基"]
  - code: "512100"
    name: "中证1000ETF南方"
    tags: ["汇金重仓", "宽基"]

  # ---- 科创 50 / 创业板 ----
  - code: "588000"
    name: "科创50ETF华夏"
    tags: ["汇金重仓", "宽基"]
  - code: "159915"
    name: "创业板ETF易方达"
    tags: ["汇金重仓", "宽基"]

# 报告期持有人抽取覆盖的代码（B 线用）。默认与 A 线同一个池子；要单独扩池时
# 在这里加 `holdings_pool:` 段即可，缺省回落到 `pool:`。