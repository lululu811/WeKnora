name: Python Service

on:
  push:
    branches: [main, mine]
    paths:
      - "python-service/**"
      - ".github/workflows/python-service.yml"
  pull_request:
    paths:
      - "python-service/**"
      - ".github/workflows/python-service.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-service/requirements.txt pytest pytest-asyncio httpx

      - name: Run unit tests
        run: |
          cd python-service
          python -m pytest tests/unit -v
