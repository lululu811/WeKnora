name: Go Lint

# The repository carries a large backlog of pre-existing golangci-lint findings,
# so changes are only judged on the code they introduce. The companion
# go-lint-cache.yml keeps the caches this job restores from warm on main.
#
# The filter is golangci-lint's own `--new-from-merge-base` rather than the
# action's `only-new-issues`, because that option asks the GitHub API for the
# pull request patch and the API refuses any diff over 20000 lines
# ("code": "too_large"). On a large pull request the action silently falls back
# to linting everything, which reports the entire backlog and can never pass.
# Computing the merge base from git has no size limit, and `fetch-depth: 0`
# below is what makes the base commit available to do it.
#
# Pushes also run this workflow, which is why the base is resolved through
# LINT_BASE below instead of read straight out of the pull_request payload: on a
# push event that payload is absent, and reading it directly left the diff range
# empty and `--new-from-merge-base=` argument-less. The push trigger exists for
# `mine` — the long-lived branch holding this fork's work. `main` is a pure
# mirror of upstream and never receives a commit, and this fork never opens a
# pull request, so before this the workflow could not run at all and
# golangci-lint never executed anywhere.

on:
  push:
    branches: [mine]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct
  # Base and head of the "only look at what changed" range.
  #
  # Pull requests use their own base/head. Pushes use github.event.before — the
  # tip the branch had before this push — which gives the same "judge only what
  # this change introduced" semantics a pull request gets. It is deliberately
  # *not* origin/main: the fork's main is a mirror that can lag upstream, and
  # diffing `mine` against it would mark the entire fork delta (400+ Go files)
  # as new on the first run and report a backlog this workflow exists to avoid.
  #
  # `before` is all-zeros for a new branch and can name a commit that no longer
  # exists after a force push, so the resolve step below validates it and falls
  # back to origin/main. fetch-depth: 0 is what makes either rev available.
  LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  LINT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Path filters above start this workflow for any Go change; the matrix still
  # used to lint all three modules. Detect which modules the PR actually
  # touches so a root-only change (migrations test, handler, …) does not queue
  # cli/ and client/ runners. Changing .golangci.yml or this workflow still
  # lints every module, since they share the root config.
  changes:
    name: detect lint modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      base: ${{ steps.resolve.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve diff base
        id: resolve
        shell: bash
        run: |
          base="${{ env.LINT_BASE }}"
          reason=""
          if [ -z "$base" ]; then
            reason="no base in the event payload"
          elif [ "$base" = "0000000000000000000000000000000000000000" ]; then
            reason="new branch (github.event.before is all zeros)"
          elif ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            reason="base commit is not in this checkout (force push?)"
          fi
          if [ -n "$reason" ]; then
            echo "Lint base '$base' unusable — $reason; falling back to origin/main."
            base="origin/main"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Lint base: $base"
      - name: Detect changed modules
        id: detect
        shell: bash
        env:
          DIFF_BASE: ${{ steps.resolve.outputs.base }}
        run: |
          diff_range="${DIFF_BASE}...${{ env.LINT_HEAD }}"
          modules=()
          if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
               .golangci.yml .github/workflows/go-lint.yml | grep -q .; then
            modules=("." "cli" "client")
          else
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
                 '*.go' ':!cli/**' ':!client/**' go.mod go.sum | grep -q .; then
              modules+=(".")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'cli/**' | grep -q .; then
              modules+=("cli")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'client/**' | grep -q .; then
              modules+=("client")
            fi
          fi
          json="["
          first=1
          for m in "${modules[@]}"; do
            if [ "$first" -eq 1 ]; then
              first=0
            else
              json+=","
            fi
            json+="\"${m}\""
          done
          json+="]"
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          # Deliberately off: see the note at the top of this file. The same
          # filtering is done below, from git.
          only-new-issues: false
          args: --new-from-merge-base=${{ needs.changes.outputs.base }}
